<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your account at Momentum to edit, create or delete posts on the blog. Momentum is a go-to source for fitness inspiration and knowledge, empowering people to embrace a healthy and active lifestyle.">
  <title>Momentum | Login</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <script src="https://kit.fontawesome.com/b47f15c436.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/post.css">
  <script src="../js/script.js" type="module"></script>
  <script src="../js/login.js" type="module"></script>
</head>
<body>
  <header>
    <a href="../index.html" class="logo">momentum</a>
    <button id="menu-btn" aria-label="dropdown menu">
      <i class="fa-solid fa-bars fa-3x" aria-hidden="true"></i>
    </button>
    <nav id="navigation-menu">
      <ul id="navigation-list">
        <li class="close-btn">
          <i class="fa-solid fa-xmark fa-3x"></i>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Login</h1>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="username@stud.noroff.no">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">

        <button type="submit" class="primary-btn">login</button>  
      </form>


      <p class="link-message">Don´t have an account? <a href="register.html" class="text-link">Register</a></p>
    </section>
  </main>

  <footer>
    <p>© 2025 Martine Kongsrud. All rights reserved.</p>
  </footer>
</body>
</html>
